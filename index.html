<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ranking — Ninja Frog</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg1: #0f0c29; --bg2: #1a1a6e; --bg3: #2d1b69;
    --accent1: #f0547a; --accent2: #5ec8e0;
    --gold: #ffd166; --silver: #c0c0c0; --bronze: #cd7f32;
    --text: #f0eeff; --muted: #9991cc;
    --card: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.1);
    --jury: #a78bfa;
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
    min-height: 100vh; font-family: 'Nunito', sans-serif;
    color: var(--text); overflow-x: hidden;
    padding-top: env(safe-area-inset-top, 16px);
  }
  body::before, body::after {
    content: ''; position: fixed; border-radius: 50%;
    filter: blur(80px); opacity: 0.25; pointer-events: none; z-index: 0;
    animation: drift 12s ease-in-out infinite alternate;
  }
  body::before { width: 400px; height: 400px; background: radial-gradient(circle, #f0547a, transparent); top: -100px; left: -100px; }
  body::after { width: 400px; height: 400px; background: radial-gradient(circle, #5ec8e0, transparent); bottom: -100px; right: -100px; animation-delay: -6s; }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(30px,20px) scale(1.08); } }

  .wrapper { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; padding: 2.5rem 1rem 4rem; }

  .header { text-align: center; margin-bottom: 2rem; }
  .brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(2.8rem, 10vw, 5rem);
    letter-spacing: 0.08em;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    line-height: 1;
  }
  .subtitle { font-size: 0.72rem; font-weight: 800; letter-spacing: 0.22em; text-transform: uppercase; color: var(--muted); margin-top: 0.4rem; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.07); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 14px; font-size: 0.7rem;
    font-weight: 700; letter-spacing: 0.08em; text-transform: uppercase;
    color: var(--muted); margin-top: 0.8rem; transition: all 0.3s;
  }
  .status-pill.live { color: #6ee7b7; border-color: rgba(110,231,183,0.3); background: rgba(110,231,183,0.07); }
  .status-pill.offline { color: var(--accent1); border-color: rgba(240,84,122,0.3); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #6ee7b7; animation: blink 1.8s ease-in-out infinite; flex-shrink: 0; }
  .dot.off { background: var(--accent1); animation: none; }
  @keyframes blink { 0%,100%{opacity:1}50%{opacity:0.3} }

  .form-wrap {
    background: var(--card); border: 1px solid var(--border);
    border-radius: 20px; padding: 1.25rem; margin-bottom: 1.5rem;
    backdrop-filter: blur(10px);
  }
  .form-row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.65rem; font-weight: 800; letter-spacing: 0.13em; text-transform: uppercase; color: var(--muted); }
  .field label.jury-label { color: var(--jury); }
  .field input {
    background: rgba(255,255,255,0.06); border: 1px solid var(--border);
    border-radius: 12px; padding: 0 12px; height: 48px;
    font-size: 1rem; font-family: 'Nunito', sans-serif;
    color: var(--text); outline: none; width: 100%;
    transition: border-color 0.2s, background 0.2s;
  }
  .field input::placeholder { color: rgba(255,255,255,0.25); }
  .field input:focus { border-color: var(--accent2); background: rgba(94,200,224,0.08); }
  .field input.jury-input:focus { border-color: var(--jury); background: rgba(167,139,250,0.08); }

  .btn-add {
    width: 100%; height: 50px; border-radius: 14px; border: none;
    background: linear-gradient(135deg, var(--accent1), #c0336a);
    color: #fff; font-family: 'Nunito', sans-serif;
    font-size: 1rem; font-weight: 800; cursor: pointer;
    letter-spacing: 0.05em; transition: transform 0.15s, box-shadow 0.15s;
    box-shadow: 0 4px 20px rgba(240,84,122,0.35);
  }
  .btn-add:active { transform: scale(0.97); }
  .err { font-size: 0.75rem; color: var(--accent1); margin-top: 6px; display: none; font-weight: 700; }
  .form-footer { display: flex; align-items: center; justify-content: flex-end; margin-top: 0.9rem; }
  .sync-info { font-size: 0.68rem; color: var(--muted); font-weight: 700; letter-spacing: 0.06em; flex: 1; }

  .ranking-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 0.75rem; gap: 8px; }
  .ranking-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.4rem; letter-spacing: 0.12em; color: var(--muted); }
  .ranking-right { display: flex; align-items: center; gap: 12px; }
  .ranking-count { font-size: 0.72rem; font-weight: 800; color: var(--muted); letter-spacing: 0.08em; }
  .btn-clear {
    position: fixed; top: max(env(safe-area-inset-top, 0px) + 12px, 12px); right: 16px;
    z-index: 100;
    background: rgba(15,12,41,0.7); backdrop-filter: blur(10px);
    border: 1px solid var(--border); border-radius: 10px;
    color: var(--muted); font-size: 0.68rem; font-weight: 700;
    letter-spacing: 0.08em; text-transform: uppercase;
    padding: 8px 14px; cursor: pointer; transition: all 0.2s; font-family: 'Nunito', sans-serif;
  }
  .btn-clear:hover { border-color: var(--accent1); color: var(--accent1); }

  .list { display: flex; flex-direction: column; gap: 8px; }
  .entry {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 12px 14px; backdrop-filter: blur(8px);
    transition: border-color 0.2s; animation: fadeSlide 0.35s ease both;
  }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(-8px); } to { opacity: 1; transform: translateY(0); } }
  .entry.rank-1 { border-color: rgba(255,209,102,0.5); background: rgba(255,209,102,0.06); }
  .entry.rank-2 { border-color: rgba(192,192,192,0.4); background: rgba(192,192,192,0.05); }
  .entry.rank-3 { border-color: rgba(205,127,50,0.4); background: rgba(205,127,50,0.05); }
  .rank-badge {
    width: 38px; height: 38px; min-width: 38px; border-radius: 10px;
    display: flex; align-items: center; justify-content: center;
    font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem;
    background: rgba(255,255,255,0.06); color: var(--muted); border: 1px solid var(--border);
  }
  .entry.rank-1 .rank-badge { background: rgba(255,209,102,0.15); color: var(--gold); border-color: rgba(255,209,102,0.4); font-size: 1.4rem; }
  .entry.rank-2 .rank-badge { background: rgba(192,192,192,0.12); color: var(--silver); border-color: rgba(192,192,192,0.35); font-size: 1.4rem; }
  .entry.rank-3 .rank-badge { background: rgba(205,127,50,0.12); color: var(--bronze); border-color: rgba(205,127,50,0.35); font-size: 1.4rem; }

  .entry-info { flex: 1; min-width: 0; }
  .entry-name { font-size: 1rem; font-weight: 800; color: var(--text); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .entry-breakdown { font-size: 0.68rem; color: var(--muted); margin-top: 2px; }
  .entry-breakdown .jury-pts { color: var(--jury); font-weight: 700; }

  .entry-score {
    font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 0.05em; flex-shrink: 0;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
  }
  .entry.rank-1 .entry-score { background: linear-gradient(90deg, var(--gold), #ffaa00); -webkit-background-clip: text; background-clip: text; }
  .score-unit { font-size: 0.6rem; color: var(--muted); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; align-self: flex-end; margin-bottom: 5px; flex-shrink: 0; }
  .del-btn { background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.2); font-size: 0.85rem; padding: 6px 8px; border-radius: 6px; transition: all 0.15s; flex-shrink: 0; }
  .del-btn:hover { color: var(--accent1); background: rgba(240,84,122,0.12); }
  .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 0.9rem; border: 1px dashed var(--border); border-radius: 16px; }
  .empty span { font-size: 2rem; display: block; margin-bottom: 0.5rem; opacity: 0.4; }

  @media (max-width: 480px) {
    .form-row { grid-template-columns: 1fr 1fr; }
    .form-row .field:first-child { grid-column: span 2; }
  }
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <div class="brand">Ninja Frog</div>
    <div class="subtitle">Ranking Eliminacji</div>
    <div class="status-pill" id="statusPill">
      <span class="dot off" id="dot"></span>
      <span id="statusText">łączenie...</span>
    </div>
  </div>

  <div class="form-wrap">
    <div class="form-row">
      <div class="field">
        <label>Imię</label>
        <input id="nameInput" type="text" placeholder="np. Kasia" maxlength="30" autocomplete="off"/>
      </div>
      <div class="field">
        <label>Wynik</label>
        <input id="scoreInput" type="number" placeholder="0" step="any" inputmode="decimal"/>
      </div>
      <div class="field">
        <label class="jury-label">+ Jury</label>
        <input id="juryInput" type="number" placeholder="0" step="any" inputmode="decimal" class="jury-input"/>
      </div>
    </div>
    <button class="btn-add" onclick="addEntry()">+ Dodaj</button>
    <div class="err" id="err">Wypełnij imię i wynik!</div>
    <div class="form-footer">
      <span class="sync-info">Synchronizacja na żywo</span>
    </div>
  </div>

  <button class="btn-clear" onclick="clearAll()">Wyczyść</button>

  <div class="ranking-header">
    <div class="ranking-title">Wyniki</div>
    <div class="ranking-count" id="countLabel">0 zawodników</div>
  </div>
  <div class="list" id="list">
    <div class="empty"><span>🏆</span>Brak wyników — dodaj pierwszego zawodnika!</div>
  </div>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
  import { getDatabase, ref, onValue, set } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyBTOosW_Gy6iO5SnRo47tYzGcGJPqbvF2E",
    authDomain: "ninja-frog-ranking.firebaseapp.com",
    databaseURL: "https://ninja-frog-ranking-default-rtdb.europe-west1.firebasedatabase.app",
    projectId: "ninja-frog-ranking",
    storageBucket: "ninja-frog-ranking.firebasestorage.app",
    messagingSenderId: "425653435372",
    appId: "1:425653435372:web:cb549a5773deb7b82ddec9"
  };

  const app = initializeApp(firebaseConfig);
  const db = getDatabase(app);
  const rankingRef = ref(db, 'ranking');
  let entries = [];

  function setStatus(ok) {
    const pill = document.getElementById('statusPill');
    const dot = document.getElementById('dot');
    const txt = document.getElementById('statusText');
    if (ok) { pill.className = 'status-pill live'; dot.className = 'dot'; txt.textContent = 'na żywo — wszystkie urządzenia'; }
    else { pill.className = 'status-pill offline'; dot.className = 'dot off'; txt.textContent = 'brak połączenia'; }
  }

  onValue(rankingRef, (snapshot) => {
    const data = snapshot.val();
    entries = data ? Object.values(data) : [];
    entries.sort((a, b) => (b.score + (b.jury||0)) - (a.score + (a.jury||0)));
    render();
    setStatus(true);
  }, () => setStatus(false));

  function saveEntries() {
    const obj = {};
    entries.forEach(e => { obj[e.id] = e; });
    set(rankingRef, obj).catch(() => setStatus(false));
  }

  window.addEntry = function() {
    const nameEl = document.getElementById('nameInput');
    const scoreEl = document.getElementById('scoreInput');
    const juryEl = document.getElementById('juryInput');
    const err = document.getElementById('err');
    const name = nameEl.value.trim();
    const score = parseFloat(scoreEl.value);
    const jury = parseFloat(juryEl.value) || 0;
    if (!name || isNaN(score)) { err.style.display = 'block'; return; }
    err.style.display = 'none';
    entries.push({ id: 'e' + Date.now(), name, score, jury });
    entries.sort((a, b) => (b.score + (b.jury||0)) - (a.score + (a.jury||0)));
    nameEl.value = ''; scoreEl.value = ''; juryEl.value = '';
    nameEl.focus();
    render();
    saveEntries();
  };

  window.deleteEntry = function(id) {
    entries = entries.filter(e => e.id !== id);
    render();
    saveEntries();
  };

  window.clearAll = function() {
    if (!confirm('Wyczyścić cały ranking?')) return;
    entries = [];
    render();
    set(rankingRef, null);
  };

  const MEDALS = ['🥇','🥈','🥉'];
  function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function fmt(s) { return Number.isInteger(s) ? s : parseFloat(s.toFixed(2)); }

  function render() {
    const list = document.getElementById('list');
    const n = entries.length;
    document.getElementById('countLabel').textContent = n + ' zawodnik' + (n === 1 ? '' : 'ów');
    if (n === 0) { list.innerHTML = '<div class="empty"><span>🏆</span>Brak wyników — dodaj pierwszego zawodnika!</div>'; return; }
    list.innerHTML = '';
    entries.forEach((e, i) => {
      const rank = i + 1;
      const jury = e.jury || 0;
      const total = e.score + jury;
      const div = document.createElement('div');
      div.className = 'entry' + (rank <= 3 ? ' rank-' + rank : '');
      const breakdown = jury !== 0
        ? `<div class="entry-breakdown">${fmt(e.score)} pkt + <span class="jury-pts">+${fmt(jury)} jury</span></div>`
        : '';
      div.innerHTML = `
        <div class="rank-badge">${rank <= 3 ? MEDALS[i] : rank}</div>
        <div class="entry-info">
          <div class="entry-name">${esc(e.name)}</div>
          ${breakdown}
        </div>
        <div class="entry-score">${fmt(total)}</div>
        <div class="score-unit">pkt</div>
        <button class="del-btn" onclick="deleteEntry('${e.id}')" title="Usuń">✕</button>
      `;
      list.appendChild(div);
    });
  }

  document.getElementById('juryInput').addEventListener('keydown', e => { if (e.key==='Enter') window.addEntry(); });
  document.getElementById('scoreInput').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('juryInput').focus(); });
  document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('scoreInput').focus(); });
</script>
</body>
</html>
