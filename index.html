<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Ranking — Ninja Frog</title>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Nunito:wght@400;700;800&display=swap" rel="stylesheet" />
<style>
  :root {
    --bg1: #0f0c29; --bg2: #1a1a6e; --bg3: #2d1b69;
    --accent1: #f0547a; --accent2: #5ec8e0;
    --gold: #ffd166; --silver: #c0c0c0; --bronze: #cd7f32;
    --text: #f0eeff; --muted: #9991cc;
    --card: rgba(255,255,255,0.05); --border: rgba(255,255,255,0.1);
  }
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    background: linear-gradient(135deg, var(--bg1) 0%, var(--bg2) 45%, var(--bg3) 100%);
    min-height: 100vh; font-family: 'Nunito', sans-serif;
    color: var(--text); overflow-x: hidden;
  }
  body::before, body::after {
    content: ''; position: fixed; border-radius: 50%;
    filter: blur(80px); opacity: 0.25; pointer-events: none; z-index: 0;
    animation: drift 12s ease-in-out infinite alternate;
  }
  body::before { width: 600px; height: 600px; background: radial-gradient(circle, #f0547a, transparent); top: -150px; left: -150px; }
  body::after { width: 500px; height: 500px; background: radial-gradient(circle, #5ec8e0, transparent); bottom: -100px; right: -100px; animation-delay: -6s; }
  @keyframes drift { from { transform: translate(0,0) scale(1); } to { transform: translate(40px,30px) scale(1.08); } }
  .wrapper { position: relative; z-index: 1; max-width: 620px; margin: 0 auto; padding: 2rem 1rem 4rem; }
  .header { text-align: center; margin-bottom: 2.5rem; }
  .brand {
    font-family: 'Bebas Neue', sans-serif;
    font-size: clamp(3.5rem, 14vw, 6rem);
    letter-spacing: 0.08em;
    background: linear-gradient(90deg, var(--accent1), var(--accent2));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text;
    line-height: 1;
  }
  .subtitle { font-size: 0.78rem; font-weight: 800; letter-spacing: 0.25em; text-transform: uppercase; color: var(--muted); margin-top: 0.4rem; }
  .status-pill {
    display: inline-flex; align-items: center; gap: 6px;
    background: rgba(255,255,255,0.07); border: 1px solid var(--border);
    border-radius: 999px; padding: 4px 14px; font-size: 0.72rem;
    font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase;
    color: var(--muted); margin-top: 1rem; transition: all 0.3s;
  }
  .status-pill.live { color: #6ee7b7; border-color: rgba(110,231,183,0.3); background: rgba(110,231,183,0.07); }
  .status-pill.offline { color: var(--accent1); border-color: rgba(240,84,122,0.3); }
  .dot { width: 7px; height: 7px; border-radius: 50%; background: #6ee7b7; animation: blink 1.8s ease-in-out infinite; }
  .dot.off { background: var(--accent1); animation: none; }
  @keyframes blink { 0%,100%{opacity:1}50%{opacity:0.3} }
  .form-wrap { background: var(--card); border: 1px solid var(--border); border-radius: 20px; padding: 1.4rem 1.5rem; margin-bottom: 2rem; backdrop-filter: blur(10px); }
  .form-row { display: grid; grid-template-columns: 1fr 140px auto; gap: 10px; align-items: end; }
  .field { display: flex; flex-direction: column; gap: 5px; }
  .field label { font-size: 0.7rem; font-weight: 800; letter-spacing: 0.15em; text-transform: uppercase; color: var(--muted); }
  .field input { background: rgba(255,255,255,0.06); border: 1px solid var(--border); border-radius: 12px; padding: 0 14px; height: 44px; font-size: 0.95rem; font-family: 'Nunito', sans-serif; color: var(--text); outline: none; transition: border-color 0.2s, background 0.2s; }
  .field input::placeholder { color: rgba(255,255,255,0.25); }
  .field input:focus { border-color: var(--accent2); background: rgba(94,200,224,0.08); }
  .btn-add { height: 44px; padding: 0 20px; border-radius: 12px; border: none; background: linear-gradient(135deg, var(--accent1), #c0336a); color: #fff; font-family: 'Nunito', sans-serif; font-size: 0.9rem; font-weight: 800; cursor: pointer; letter-spacing: 0.05em; transition: transform 0.15s, box-shadow 0.15s; white-space: nowrap; box-shadow: 0 4px 20px rgba(240,84,122,0.35); }
  .btn-add:hover { transform: translateY(-2px); box-shadow: 0 8px 28px rgba(240,84,122,0.5); }
  .btn-add:active { transform: scale(0.97); }
  .err { font-size: 0.75rem; color: var(--accent1); margin-top: 8px; display: none; font-weight: 700; }
  .form-footer { display: flex; align-items: center; justify-content: space-between; margin-top: 1rem; }
  .btn-clear { background: none; border: 1px solid var(--border); border-radius: 8px; color: var(--muted); font-size: 0.72rem; font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; padding: 5px 12px; cursor: pointer; transition: all 0.2s; font-family: 'Nunito', sans-serif; }
  .btn-clear:hover { border-color: var(--accent1); color: var(--accent1); }
  .ranking-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 1rem; }
  .ranking-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.5rem; letter-spacing: 0.12em; color: var(--muted); }
  .ranking-count { font-size: 0.75rem; font-weight: 800; color: var(--muted); letter-spacing: 0.1em; }
  .list { display: flex; flex-direction: column; gap: 8px; }
  .entry { display: flex; align-items: center; gap: 14px; background: var(--card); border: 1px solid var(--border); border-radius: 16px; padding: 12px 16px; backdrop-filter: blur(8px); transition: transform 0.2s, border-color 0.2s; animation: fadeSlide 0.35s ease both; }
  @keyframes fadeSlide { from { opacity: 0; transform: translateY(-10px); } to { opacity: 1; transform: translateY(0); } }
  .entry:hover { transform: translateX(4px); border-color: rgba(255,255,255,0.18); }
  .entry.rank-1 { border-color: rgba(255,209,102,0.5); background: rgba(255,209,102,0.06); }
  .entry.rank-2 { border-color: rgba(192,192,192,0.4); background: rgba(192,192,192,0.05); }
  .entry.rank-3 { border-color: rgba(205,127,50,0.4); background: rgba(205,127,50,0.05); }
  .rank-badge { width: 36px; height: 36px; min-width: 36px; border-radius: 10px; display: flex; align-items: center; justify-content: center; font-family: 'Bebas Neue', sans-serif; font-size: 1.1rem; background: rgba(255,255,255,0.06); color: var(--muted); border: 1px solid var(--border); }
  .entry.rank-1 .rank-badge { background: rgba(255,209,102,0.15); color: var(--gold); border-color: rgba(255,209,102,0.4); font-size: 1.3rem; }
  .entry.rank-2 .rank-badge { background: rgba(192,192,192,0.12); color: var(--silver); border-color: rgba(192,192,192,0.35); font-size: 1.3rem; }
  .entry.rank-3 .rank-badge { background: rgba(205,127,50,0.12); color: var(--bronze); border-color: rgba(205,127,50,0.35); font-size: 1.3rem; }
  .entry-name { flex: 1; font-size: 1rem; font-weight: 800; color: var(--text); }
  .entry-score { font-family: 'Bebas Neue', sans-serif; font-size: 1.6rem; letter-spacing: 0.05em; background: linear-gradient(90deg, var(--accent1), var(--accent2)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; background-clip: text; }
  .entry.rank-1 .entry-score { background: linear-gradient(90deg, var(--gold), #ffaa00); -webkit-background-clip: text; background-clip: text; }
  .score-unit { font-size: 0.65rem; color: var(--muted); font-weight: 700; letter-spacing: 0.1em; text-transform: uppercase; align-self: flex-end; margin-bottom: 6px; }
  .del-btn { background: none; border: none; cursor: pointer; color: rgba(255,255,255,0.2); font-size: 0.9rem; padding: 4px 6px; border-radius: 6px; transition: all 0.15s; }
  .del-btn:hover { color: var(--accent1); background: rgba(240,84,122,0.12); }
  .empty { text-align: center; padding: 3rem 1rem; color: var(--muted); font-size: 0.9rem; border: 1px dashed var(--border); border-radius: 16px; }
  .empty span { font-size: 2rem; display: block; margin-bottom: 0.5rem; opacity: 0.4; }
  @media (max-width: 480px) { .form-row { grid-template-columns: 1fr 1fr; } .btn-add { grid-column: span 2; } }
</style>
</head>
<body>
<div class="wrapper">
  <div class="header">
    <div class="brand">Ninja Frog</div>
    <div class="subtitle">Ranking Eliminacji</div>
    <div class="status-pill" id="statusPill">
      <span class="dot off" id="dot"></span>
      <span id="statusText">łączenie...</span>
    </div>
  </div>

  <div class="form-wrap">
    <div class="form-row">
      <div class="field">
        <label>Imię</label>
        <input id="nameInput" type="text" placeholder="np. Kasia" maxlength="30" autocomplete="off"/>
      </div>
      <div class="field">
        <label>Wynik</label>
        <input id="scoreInput" type="number" placeholder="0" step="any"/>
      </div>
      <button class="btn-add" onclick="addEntry()">+ Dodaj</button>
    </div>
    <div class="err" id="err">Wypełnij imię i wynik!</div>
    <div class="form-footer">
      <div style="font-size:0.7rem;color:var(--muted);font-weight:700;letter-spacing:0.08em;">Synchronizacja co 3 sek.</div>
      <button class="btn-clear" onclick="clearAll()">Wyczyść ranking</button>
    </div>
  </div>

  <div class="ranking-header">
    <div class="ranking-title">Wyniki</div>
    <div class="ranking-count" id="countLabel">0 zawodników</div>
  </div>
  <div class="list" id="list">
    <div class="empty"><span>🏆</span>Brak wyników — dodaj pierwszego zawodnika!</div>
  </div>
</div>
<script>
const STORAGE_KEY = 'triki_ranking_v1';
const SHARED = true;
let entries = [];

async function loadEntries(animate) {
  try {
    const result = await window.storage.get(STORAGE_KEY, SHARED);
    const prev = entries.length;
    entries = result ? JSON.parse(result.value) : [];
    if (!Array.isArray(entries)) entries = [];
    render(animate && entries.length > prev);
    setStatus(true);
  } catch(e) { setStatus(false); }
}
async function saveEntries() {
  try { await window.storage.set(STORAGE_KEY, JSON.stringify(entries), SHARED); setStatus(true); }
  catch(e) { setStatus(false); }
}
function setStatus(ok) {
  const pill = document.getElementById('statusPill');
  const dot = document.getElementById('dot');
  const txt = document.getElementById('statusText');
  if (ok) { pill.className = 'status-pill live'; dot.className = 'dot'; txt.textContent = 'na żywo — wszystkie urządzenia'; }
  else { pill.className = 'status-pill offline'; dot.className = 'dot off'; txt.textContent = 'brak połączenia'; }
}
function addEntry() {
  const nameEl = document.getElementById('nameInput');
  const scoreEl = document.getElementById('scoreInput');
  const err = document.getElementById('err');
  const name = nameEl.value.trim();
  const score = parseFloat(scoreEl.value);
  if (!name || isNaN(score)) { err.style.display = 'block'; return; }
  err.style.display = 'none';
  entries.push({ id: Date.now(), name, score });
  entries.sort((a, b) => b.score - a.score);
  nameEl.value = ''; scoreEl.value = '';
  nameEl.focus();
  render(true);
  saveEntries();
}
function deleteEntry(id) { entries = entries.filter(e => e.id !== id); render(false); saveEntries(); }
function clearAll() { if (!confirm('Wyczyścić cały ranking?')) return; entries = []; render(false); saveEntries(); }
const MEDALS = ['🥇','🥈','🥉'];
function esc(s) { return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
function fmtScore(s) { return Number.isInteger(s) ? s : parseFloat(s.toFixed(2)); }
function render(animate) {
  const list = document.getElementById('list');
  const n = entries.length;
  document.getElementById('countLabel').textContent = n + ' zawodnik' + (n === 1 ? '' : 'ów');
  if (n === 0) { list.innerHTML = '<div class="empty"><span>🏆</span>Brak wyników — dodaj pierwszego zawodnika!</div>'; return; }
  list.innerHTML = '';
  entries.forEach((e, i) => {
    const rank = i + 1;
    const div = document.createElement('div');
    div.className = 'entry' + (rank <= 3 ? ' rank-' + rank : '');
    div.innerHTML = `<div class="rank-badge">${rank <= 3 ? MEDALS[i] : rank}</div><div class="entry-name">${esc(e.name)}</div><div class="entry-score">${fmtScore(e.score)}</div><div class="score-unit">pkt</div><button class="del-btn" onclick="deleteEntry(${e.id})" title="Usuń">✕</button>`;
    list.appendChild(div);
  });
}
document.getElementById('scoreInput').addEventListener('keydown', e => { if (e.key==='Enter') addEntry(); });
document.getElementById('nameInput').addEventListener('keydown', e => { if (e.key==='Enter') document.getElementById('scoreInput').focus(); });
loadEntries(false);
setInterval(() => loadEntries(true), 3000);
</script>
</body>
</html>
